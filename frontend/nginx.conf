server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Backend-owned AI-surface files at root (E1/E4). Regex locations win
    # over the `location /` prefix fallback, so these must exist or the SPA
    # index.html shadows them.
    location = /llms.txt {
        proxy_pass http://backend:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ~ ^/docs/[^/]+/(llms\.txt|llms-full\.txt|skill\.md)$ {
        proxy_pass http://backend:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # SvelteKit hashed immutable assets — long cache
    location /_app/immutable/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # C7: /api/v1/metrics is for compose-internal Prometheus scraping only.
    # Block public access — internal scrapers reach backend:8081 directly
    # via the compose network, bypassing nginx. Returns 404 (not 403) so we
    # don't leak the route's existence.
    location = /api/v1/metrics {
        return 404;
    }

    # API reverse proxy
    location /api/ {
        proxy_pass http://backend:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SSE — disable buffering
    location /api/v1/events {
        proxy_pass http://backend:8081;
        proxy_set_header Host $host;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding off;
        proxy_buffering off;
        proxy_cache off;
    }

    # Auth routes
    location /auth/ {
        proxy_pass http://backend:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
