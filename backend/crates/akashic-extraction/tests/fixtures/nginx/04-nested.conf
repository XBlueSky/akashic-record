# top-level comment
http {
    # the log_format value contains literal braces and a semicolon inside quotes
    log_format custom "$remote_addr {nested} stuff; #notacomment more";

    server {
        server_name a.example.com;  # inline comment after directive

        location /deep {
            location /deep/inner {
                add_header X-Trick "value with } brace and ; semi";
                proxy_pass http://upstream_x;
            }
        }
    }
}

upstream upstream_x {
    server 127.0.0.1:9000;
}
