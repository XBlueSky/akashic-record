# Test stack for D3 frontend Playwright e2e.
# Brought up by `docker compose -f docker-compose.test.yml up -d --wait`
# and torn down by `docker compose -f docker-compose.test.yml down -v`.
#
# Ports are dev+50000 to avoid colliding with docker-compose.yml.
#
# DO NOT run this in production. The backend is built with
# --features test-fixtures, which exposes seed endpoints.

services:
  postgres-test:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: akashic
      POSTGRES_PASSWORD: akashic
      POSTGRES_DB: akashic
    tmpfs:
      - /var/lib/postgresql/data
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U akashic"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [akashic-test]

  neo4j-test:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/akashic-test
      NEO4J_dbms_default__database: neo4j
    tmpfs:
      - /data
      - /logs
    ports:
      - "57474:7474"
      - "57687:7687"
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p akashic-test 'RETURN 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [akashic-test]

  gitlab-mock:
    image: nginx:alpine
    volumes:
      - ./gitlab-mock/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./gitlab-mock/projects.json:/etc/gitlab-mock/projects.json:ro
    healthcheck:
      # 127.0.0.1, not localhost: this service mounts a custom root
      # nginx.conf (server block: `listen 80` — IPv4 only), which bypasses
      # the stock nginx:alpine entrypoint script that auto-adds `listen
      # [::]:80` to /etc/nginx/conf.d/default.conf. BusyBox wget resolving
      # "localhost" to ::1 first hits connection-refused with no IPv4
      # fallback, failing every retry deterministically.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/api/v4/projects?membership=true&search=akashic-record"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [akashic-test]

  backend-test:
    build:
      context: ./backend
      args:
        CARGO_FEATURES: test-fixtures
    environment:
      DATABASE_URL: postgres://akashic:akashic@postgres-test:5432/akashic
      NEO4J_URI: bolt://neo4j-test:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: akashic-test
      GITLAB_URL: http://gitlab-mock
      FRONTEND_URL: http://localhost:18080
      COOKIE_SECURE: "false"
      MIGRATE_ON_BOOT: "true"
      RUST_LOG: info
      # Disable rate-limiting in the e2e stack. Path A's anonymous read
      # burns ~30 tokens from the 60/burst general bucket; Path B's
      # authenticated edit (which immediately follows) then 429s on the
      # notes list. Rate-limit behavior has its own unit-test coverage
      # under `backend/src/middleware/rate_limit.rs` — e2e specs should
      # never share state with it.
      RATE_LIMIT_ENABLED: "false"
      # Avoid HF Hub fetch on boot — D3 read/edit/logout paths don't
      # exercise live embedding / LLM. Point providers at gitlab-mock
      # so any accidental call returns 200/empty rather than hanging
      # on DNS or network.
      EMBEDDING_PROVIDER: openai
      EMBEDDING_API_KEY: e2e-fake-embedding-key
      EMBEDDING_BASE_URL: http://gitlab-mock
      LLM_PROVIDER: openai
      LLM_API_KEY: e2e-fake-llm-key
      LLM_BASE_URL: http://gitlab-mock
    depends_on:
      postgres-test:
        condition: service_healthy
      neo4j-test:
        condition: service_healthy
      gitlab-mock:
        condition: service_healthy
    ports:
      - "13001:8081"
      - "13002:8080"   # MCP proxy SSE — D4 contract tests connect here
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8081/health"]
      interval: 3s
      timeout: 3s
      retries: 60
    networks:
      akashic-test:
        # The frontend nginx.conf has `proxy_pass http://backend:8081` hard-coded.
        # Expose this service under that name in the compose network so the
        # frontend image works unchanged.
        aliases:
          - backend

  frontend-test:
    build:
      context: ./frontend
    environment:
      # Frontend nginx proxies /api/* to backend-test inside the network.
      # If frontend/nginx.conf uses a build-time / template-substituted
      # backend host, point it at backend-test here. Otherwise the
      # default ($BACKEND_HOST or hard-coded) needs an override at
      # build-arg time — handled in Task 10 verification if needed.
      BACKEND_HOST: backend-test
    depends_on:
      backend-test:
        condition: service_healthy
    ports:
      - "18080:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 3s
      timeout: 3s
      retries: 30
    networks: [akashic-test]

networks:
  akashic-test:
    driver: bridge
